name: CI

# Runs on every push to the sole development branch, master.
# Heavier multi-arch builds live in `release.yml` and are triggered by
# pushing a `vX.Y.Z` tag.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run safe Linux Network Agent IPC and sandbox checks
        # These tests use temporary AF_UNIX sockets and inspect the unit text.
        # They do not install/start systemd units or modify runner networking.
        run: python -m pytest tests/test_network_agent_ipc.py tests/test_network_plan_contract.py tests/test_agent_control_plane.py tests/test_network_plan_builder.py -q

      - name: Run pytest
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # `npm ci` requires committed `package-lock.json`, which keeps CI
      # reproducible. `--legacy-peer-deps`
      # tolerates dev-only peer-range mismatches (e.g. lucide-react vs
      # React 19 in older lockfiles) without weakening prod resolution.
      - name: Install dependencies (npm ci, locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

      # Surface the build size in every master push run.
      - name: Report dist size
        run: du -sh dist

  dev-compose-safety:
    name: Safe dev Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Render and audit the safe dev profile
        run: |
          docker compose -f docker-compose.dev.safe.yml config --format json > "$RUNNER_TEMP/tempest-dev-compose.json"
          python - "$RUNNER_TEMP/tempest-dev-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              config = json.load(source)

          services = config["services"]
          assert set(services) == {"api", "ui"}
          for name, service in services.items():
              assert service.get("privileged") is not True, name
              assert service.get("network_mode") != "host", name
              assert service.get("pid") != "host", name
              assert service.get("cap_drop") == ["ALL"], name
              assert not service.get("cap_add"), name
              assert service.get("read_only") is True, name
              assert service.get("user", "0:0").split(":", 1)[0] != "0", name
              assert not service.get("devices"), name
              assert "no-new-privileges:true" in service.get("security_opt", []), name
              for mount in service.get("volumes", []):
                  target = mount["target"]
                  assert "docker.sock" not in str(mount), (name, mount)
                  allowed_targets = {
                      "api": {"/app/data", "/app/app", "/app/alembic", "/app/alembic.ini"},
                      "ui": {"/app/src"},
                  }[name]
                  assert target in allowed_targets, (name, target)
                  if mount["type"] == "bind":
                      assert mount.get("read_only") is True, (name, mount)
                  assert "docker.sock" not in target, (name, target)
              tmpfs = service.get("tmpfs", {})
              tmpfs_targets = set(tmpfs) if isinstance(tmpfs, dict) else {
                  entry.split(":", 1)[0] for entry in tmpfs
              }
              assert tmpfs_targets <= {"/tmp"}, (name, tmpfs_targets)
              for port in service.get("ports", []):
                  assert port.get("host_ip") == "127.0.0.1", (name, port)
              assert service.get("healthcheck"), name

          assert services["api"]["environment"].get("DEV_SAFE_MODE") == "1"
          PY

  safe-compose-runtime-smoke:
    name: Safe Compose runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/tempest-safe-compose-smoke"

      - name: Install nftables for network snapshots
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nftables

      - name: Run safe Compose build and runtime smoke
        run: |
          sudo env \
            TEMPEST_SMOKE_REPORT_DIR="$RUNNER_TEMP/tempest-safe-compose-smoke" \
            bash ./scripts/dev-safe-compose-smoke.sh

      - name: Upload sanitized smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tempest-safe-compose-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/tempest-safe-compose-smoke/
          if-no-files-found: warn
          retention-days: 14
