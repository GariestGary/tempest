name: tempest-agent-control-plane

# Agent-mode Control Plane. The legacy docker-compose.yml intentionally
# preserves PiTun compatibility and must not be used for Agent mode.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: agent
    environment:
      SECRET_KEY: "${TEMPEST_SECRET_KEY:?Set TEMPEST_SECRET_KEY}"
      DATABASE_URL: sqlite:////app/data/tempest.db
      CONTROL_PLANE_MODE: agent
      DEV_SAFE_MODE: "0"
      NETWORK_AGENT_SOCKET: /run/tempest-agent/control.sock
      DOCKER_HOST: unix:///run/tempest-no-docker.sock
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    user: "10001:${TEMPEST_AGENT_GID:?Set the numeric group ID authorized for the Agent socket}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - tempest_agent_db:/app/data
      - type: bind
        source: /run/tempest-agent/control.sock
        target: /run/tempest-agent/control.sock
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${TEMPEST_API_PORT:-8787}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  tempest_agent_db:
    name: ${TEMPEST_AGENT_DB_VOLUME:-tempest-agent-db}
